<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CapTrack admin</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height: 100vh; }

    /* Top bar */
    .topbar {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-inner {
      max-width: 1040px; margin: 0 auto; padding: 12px 16px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .topbar img { height: 24px; display: block; }
    .topbar .name { font-weight: 700; color: var(--ink); text-decoration: none; }
    .topbar .name span { color: var(--cap-blue); }
    .topbar nav { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .topbar nav a, .topbar nav button {
      font: inherit; font-size: 0.92rem; color: var(--ink-soft); text-decoration: none;
      background: none; border: 0; padding: 0.45em 0.8em; border-radius: 999px; cursor: pointer;
    }
    .topbar nav a:hover, .topbar nav button:hover { background: var(--mist); color: var(--ink); }
    .topbar nav a[aria-current='page'] { background: var(--mist); color: var(--cap-blue); font-weight: 500; }

    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 80px; display: grid; gap: 28px; }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .page-head h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -0.015em; }
    .page-head p { color: var(--ink-soft); margin-top: 6px; }
    .crumb { font-size: 0.92rem; color: var(--ink-soft); text-decoration: none; display: inline-block; margin-bottom: 10px; }
    .crumb:hover { color: var(--cap-blue); }

    .panel { background: var(--paper); border-radius: 20px; padding: 24px; border: 1px solid var(--line); }
    .panel h2 { font-size: 1.2rem; margin-bottom: 4px; }
    .panel > .sub { color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 16px; }

    /* Event lists */
    .group { display: grid; gap: 10px; }
    .group h2 { font-size: 1.05rem; color: var(--ink-soft); font-weight: 500; }
    .event-row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 4px 18px; align-items: center;
      background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md);
      padding: 16px 18px; text-decoration: none; color: inherit;
      transition: border-color 0.15s;
    }
    .event-row:hover { border-color: var(--cap-blue); }
    .event-row .t { font-weight: 700; font-size: 1.08rem; }
    .event-row .m { font-size: 0.88rem; color: var(--ink-soft); grid-column: 1; }
    .event-row .count { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: 0.85rem; color: var(--ink-soft); }
    .event-row .count b { display: block; font-size: 1.5rem; color: var(--ink); line-height: 1; }
    .event-row .pill { grid-row: 1 / span 2; grid-column: 3; }
    .group.live .event-row { border-left: 6px solid var(--ok); }
    @media (max-width: 560px) {
      .event-row { grid-template-columns: 1fr auto; }
      .event-row .pill { grid-row: auto; grid-column: 1; justify-self: start; }
      .event-row .count { grid-row: 1 / span 3; grid-column: 2; }
    }

    .empty-state { text-align: center; padding: 56px 24px; display: grid; gap: 14px; justify-items: center; }
    .empty-state svg { width: 72px; height: 72px; }
    .empty-state p { color: var(--ink-soft); max-width: 42ch; }

    /* Event detail */
    .detail { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
    @media (max-width: 820px) { .detail { grid-template-columns: 1fr; } }
    .stack { display: grid; gap: 20px; }

    .control { display: grid; gap: 14px; }
    .control .big-status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .control .big-status .pill { font-size: 0.95rem; padding: 0.35em 1em; }
    .control .explain { color: var(--ink-soft); font-size: 0.92rem; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .tally { font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--cap-blue); }
    .tally-label { color: var(--ink-soft); font-size: 0.92rem; }

    .link-box {
      display: flex; gap: 8px; align-items: center;
      background: var(--mist); border-radius: var(--radius-md); padding: 8px 8px 8px 14px;
    }
    .link-box code { flex: 1; font-size: 0.9rem; word-break: break-all; font-family: inherit; color: var(--cap-blue-deep); }

    .export textarea {
      font-size: 0.92rem; min-height: 7em; background: #f7fbfd; border-style: dashed;
    }
    .export.final { border: 2px solid var(--cap-blue); box-shadow: var(--shadow); }

    .table { width: 100%; border-collapse: collapse; font-size: 0.94rem; }
    .table th { text-align: left; font-weight: 500; color: var(--ink-soft); font-size: 0.85rem; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    .table td { padding: 10px 8px; border-bottom: 1px solid #e6f0f6; vertical-align: middle; }
    .table td.email { word-break: break-all; font-weight: 500; }
    .table td.how { color: var(--ink-soft); font-size: 0.85rem; white-space: nowrap; }
    .table td:last-child { text-align: right; }
    .table-wrap { max-height: 520px; overflow: auto; }
    .remove { background: none; border: 0; color: var(--ink-soft); cursor: pointer; font: inherit; font-size: 0.85rem; padding: 4px 8px; border-radius: 6px; }
    .remove:hover { color: var(--danger); background: var(--danger-tint); }

    .add-row { display: flex; gap: 8px; margin-top: 14px; }
    .add-row input { flex: 1; }

    /* Forms */
    .form-grid { display: grid; gap: 18px; max-width: 640px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
    .optional { font-weight: 400; color: var(--ink-soft); font-size: 0.85rem; }

    .domain-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .domain {
      display: inline-flex; align-items: center; gap: 6px;
      background: #e4effa; color: var(--cap-blue-deep); border-radius: 999px; padding: 0.3em 0.4em 0.3em 0.9em; font-weight: 500;
    }
    .domain button { background: none; border: 0; cursor: pointer; color: inherit; font-size: 1.05rem; line-height: 1; width: 1.6em; height: 1.6em; border-radius: 50%; }
    .domain button:hover { background: rgba(0,0,0,0.08); }

    /* Sign-in */
    .auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(circle at 85% 90%, rgba(18,171,219,0.25), transparent 45%), var(--mist); }
    .auth .panel { width: 100%; max-width: 420px; padding: 32px 28px; display: grid; gap: 20px; box-shadow: var(--shadow); border: 0; border-radius: var(--radius-lg); }
    .auth img { height: 28px; }
    .auth h1 { font-size: 1.7rem; }
    .auth p { color: var(--ink-soft); }

    /* Projector view */
    .qr-overlay {
      position: fixed; inset: 0; z-index: 60; background: var(--cap-blue);
      color: #fff; display: grid; place-items: center; padding: 24px; text-align: center;
    }
    .qr-overlay .inner { display: grid; gap: 22px; justify-items: center; max-width: 720px; }
    .qr-overlay h2 { font-size: clamp(2rem, 5vw, 3.4rem); }
    .qr-overlay .qr { background: #fff; padding: 18px; border-radius: 24px; }
    .qr-overlay .qr img, .qr-overlay .qr canvas { display: block; width: min(56vmin, 420px) !important; height: auto !important; }
    .qr-overlay .url { font-size: clamp(1rem, 2.4vw, 1.4rem); font-weight: 500; word-break: break-all; }
    .qr-overlay .close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="spade" viewBox="0 0 120 120">
        <path fill="#0070ad" d="M104 4C90 16 54 26 32 48 14 66 12 92 30 106c16 12 40 10 54-4 10-10 14-24 22-36 8-12 14-34-2-62Z"/>
        <path fill="#12abdb" d="M84 102c10-10 14-24 22-36 4-6 9-8 12-6 2 10-2 26-12 34-6 5-10 6-12 6 2 4 6 6 10 7-8 5-20 6-28 2 4-2 6-4 8-7Z"/>
      </symbol>
    </defs>
  </svg>
  <div id="root"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/admin.js"></script>
</body>
</html>
