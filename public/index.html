<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CapTrack check-in</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 8%, #ffffff 0, transparent 40%),
        var(--mist);
    }

    /* The oversized spade bleeding off the corner: the page's one decorative gesture. */
    .backdrop {
      position: fixed; z-index: 0; pointer-events: none;
      right: -18vmin; bottom: -22vmin; width: 78vmin; height: 78vmin;
      opacity: 0.12;
    }

    .shell {
      position: relative; z-index: 1;
      max-width: 560px; margin: 0 auto;
      padding: 28px 16px 56px;
      display: grid; gap: 28px;
    }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header img { height: 30px; width: auto; display: block; }
    .brand-tag { font-size: 0.9rem; color: var(--ink-soft); }
    .brand-tag b { color: var(--cap-blue); font-weight: 700; }

    .card {
      background: var(--paper);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      display: grid; gap: 22px;
    }
    @media (max-width: 480px) { .card { padding: 26px 20px; } }

    .headline { font-size: clamp(2rem, 7vw, 2.75rem); letter-spacing: -0.02em; }
    .lede { color: var(--ink-soft); font-size: 1.05rem; max-width: 46ch; }

    /* Event picker */
    .events { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .event-option {
      width: 100%; text-align: left; font: inherit; color: inherit;
      background: var(--paper); border: 2px solid var(--line); border-radius: var(--radius-md);
      padding: 16px 18px; cursor: pointer;
      display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .event-option:hover { border-color: var(--cap-blue); background: #f6fbfe; }
    .event-option .t { font-weight: 700; font-size: 1.1rem; }
    .event-option .m { grid-column: 1; font-size: 0.9rem; color: var(--ink-soft); }
    .event-option .go { grid-row: 1 / span 2; grid-column: 2; color: var(--cap-blue); font-weight: 500; font-size: 0.92rem; }
    .event-option.done .go { color: var(--ok); }

    .context {
      display: grid; gap: 2px; padding: 14px 16px; border-radius: var(--radius-md);
      background: var(--mist); border-left: 5px solid var(--cap-sky);
    }
    .context .t { font-weight: 700; }
    .context .m { font-size: 0.9rem; color: var(--ink-soft); }
    .context .d { font-size: 0.92rem; margin-top: 4px; }

    .domains { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 0.82rem; padding: 0.2em 0.7em; border-radius: 999px;
      background: #e4effa; color: var(--cap-blue-deep);
    }

    form { display: grid; gap: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .actions .btn-primary { flex: 1 1 auto; font-size: 1.05rem; padding: 0.85em 1.4em; }

    /* Success stamp */
    .success { text-align: center; justify-items: center; }
    .stamp { width: 148px; height: 148px; position: relative; }
    .stamp svg { width: 100%; height: 100%; overflow: visible; }
    .stamp .fill { transform: translateY(120px); animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.1s forwards; }
    .stamp .tick { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 0.45s ease-out 0.85s forwards; }
    @keyframes rise { to { transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .who {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 12px;
      padding: 12px 16px; border-radius: var(--radius-md); background: var(--mist); width: 100%;
    }
    .who .email { font-weight: 500; word-break: break-all; }
    .edit-form { width: 100%; text-align: left; }
    .muted { color: var(--ink-soft); font-size: 0.92rem; }
    .row-links { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 0.95rem; }

    .empty { text-align: center; justify-items: center; }
    .empty svg { width: 84px; height: 84px; }

    footer { text-align: center; font-size: 0.85rem; color: var(--ink-soft); }
    footer a { color: inherit; }

    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
    .loading { text-align: center; color: var(--ink-soft); padding: 40px 0; }
  </style>
</head>
<body>
  <svg class="backdrop" viewBox="0 0 120 120" aria-hidden="true"><use href="#spade"/></svg>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="spade" viewBox="0 0 120 120">
        <path fill="#0070ad" d="M104 4C90 16 54 26 32 48 14 66 12 92 30 106c16 12 40 10 54-4 10-10 14-24 22-36 8-12 14-34-2-62Z"/>
        <path fill="#12abdb" d="M84 102c10-10 14-24 22-36 4-6 9-8 12-6 2 10-2 26-12 34-6 5-10 6-12 6 2 4 6 6 10 7-8 5-20 6-28 2 4-2 6-4 8-7Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="shell">
    <header>
      <img src="/logo.png" alt="Capgemini">
      <span class="brand-tag"><b>CapTrack</b> check-in</span>
    </header>

    <main id="app" class="card" aria-live="polite">
      <p class="loading">Finding today&rsquo;s events&hellip;</p>
    </main>

    <footer>Running an event? <a href="/admin">Organiser sign-in</a></footer>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
